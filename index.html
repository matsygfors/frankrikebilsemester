  <script>
    // GitHub Pages lets browsers keep index.html for ten minutes. Ask for the current version without any cache
    // (version.json is written by scripts/stamp.mjs); if this page is older, load the new one. The ?v= in the
    // new address makes the browser fetch it fresh, and also stops this from repeating.
    (() => {
      const mine = document.querySelector('meta[name="app-version"]').content;
      fetch(`version.json?t=${Date.now()}`, { cache: 'no-store' })
        .then((res) => (res.ok ? res.json() : null))
        .then((current) => {
          if (!current || current.version === mine) return;
          const url = new URL(location.href);
          if (url.searchParams.get('v') === current.version) return;
          url.searchParams.set('v', current.version);
          location.replace(url);
        })
        .catch(() => {});
    })();
  </script>
  <script>
    // If the app cannot start (an old cached file, no network), say so instead of "Läser in underlaget" for ever.
    const stuck = () => {
      const el = document.querySelector('#view .loading');
      if (el) el.textContent = 'Sidan kunde inte startas. Ladda om med Cmd + Skift + R (Ctrl + Skift + R på Windows).';
    };
    addEventListener('error', () => setTimeout(stuck, 0));
    setTimeout(stuck, 10000);
  </script>
